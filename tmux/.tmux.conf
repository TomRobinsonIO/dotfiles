# =============================================================================
# TERMINAL SETTINGS
# =============================================================================
set-option default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# =============================================================================
# TIMEOUT & INDEX SETTINGS
# =============================================================================
set-option -sg escape-time 10
set -g base-index 1

# =============================================================================
# PREFIX CONFIGURATION
# =============================================================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# =============================================================================
# MOUSE SUPPORT
# =============================================================================
set -g mouse on

# =============================================================================
# WINDOW MANAGEMENT BINDINGS
# =============================================================================
# Clear scrollback
bind K send-keys -R \; clear-history

# Reload config
bind r source-file ~/.tmux.conf

# =============================================================================
# VI MODE
# =============================================================================
set-window-option -g mode-keys vi

# Copy mode yank to system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# =============================================================================
# PANE NAVIGATION (vim-style)
# =============================================================================
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# =============================================================================
# UTILITY TOOLS
# =============================================================================
# URL Launcher (behind prefix: Ctrl+a, then C-u)
bind-key C-u run-shell -b "tmux capture-pane -J -p | rg -o \"https?://[^[:space:]<>\\(\\)\\\"']+\" | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"

# =============================================================================
# F12 KEY LOCK TMUX
# =============================================================================
bind -T root F12  \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#{@thm_subtext_1},bg=#{@thm_crust}" \;\
  set window-status-current-format "#[fg=#{@thm_rosewater},bg=#{@thm_surface_0}]$separator_powerline_right#[default] #I:#W# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
  set window-status-current-style "fg=#{@thm_mantle},bold,bg=#{@thm_rosewater}" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

wg_is_keys_off="#[fg=$thm_rosewater,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

# =============================================================================
# PLUGIN CONFIGURATION
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'arcticicestudio/nord-tmux'

# Theme options
set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, latte
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_menu_selected_style "fg=#{@thm_surface_0},bg=#{@thm_yellow}"
# set -g @tmux-gruvbox 'dark' # or 'light'

# Resurrect options
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# Continuum options
set -g @continuum-restore 'on'
set -g @continuum-boot 'off' # Don't auto-launch at boot

# Load Catppuccin theme
run ~/.tmux/plugins/tmux/catppuccin.tmux

# =============================================================================
# STATUS LINE CONFIGURATION
# =============================================================================
set -g status-position top
set -g status-right-length 200
set -g status-left-length 100
set -g status-left ""
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Window text display
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# =============================================================================
# TPM INITIALIZATION (KEEP AT BOTTOM OF CONFIGURATION)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
